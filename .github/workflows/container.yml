name: Build and publish container
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  container:
    runs-on: ubuntu-latest
    env:
      IMAGE: chetan-portfolio.central-india.cr.tower.cloud/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read release version
        id: version
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "VERSION must be major.minor, such as 1.0"; exit 1; }
          echo "tag=$version" >> "$GITHUB_OUTPUT"
      - name: Test deployment logic
        run: node --test scripts/deploy-container.test.mjs
      - name: Build and run embedded tests
        run: docker build -t "$IMAGE:${GITHUB_SHA}" .
      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --name portfolio-check -p 127.0.0.1:3000:3000 "$IMAGE:${GITHUB_SHA}"
          trap 'docker logs portfolio-check; docker rm -f portfolio-check' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:3000/ >/dev/null
          curl --fail http://127.0.0.1:3000/api/portfolio >/dev/null
      - name: Log in to Tower registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.TOWER_AUTO_DEPLOY != 'true'
        uses: docker/login-action@v4
        with:
          registry: chetan-portfolio.central-india.cr.tower.cloud
          username: ${{ secrets.TOWER_REGISTRY_USERNAME }}
          password: ${{ secrets.TOWER_REGISTRY_PASSWORD }}
      - name: Push tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.TOWER_AUTO_DEPLOY != 'true'
        run: |
          docker tag "$IMAGE:${GITHUB_SHA}" "$IMAGE:${{ steps.version.outputs.tag }}"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:${{ steps.version.outputs.tag }}"
      - name: Build, push and deploy with Tower action
        id: tower
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.TOWER_AUTO_DEPLOY == 'true'
        uses: chetankrishna03/container-instance-deploy-actions@8f77aa00c5c1d9c25f9f592b02c22fd6f0b864af
        with:
          image_tag: ${{ steps.version.outputs.tag }}
          tower_user: ${{ secrets.TOWER_USER }}
          tower_password: ${{ secrets.TOWER_PASSWORD }}
          organization_id: ${{ secrets.TOWER_ORG_ID }}
          container_name: chetan-portfolio
          tcr_name: chetan-portfolio
      - name: Wait for Tower rollout and check health
        if: steps.tower.outcome == 'success'
        timeout-minutes: 15
        env:
          TOWER_USER: ${{ secrets.TOWER_USER }}
          TOWER_PASSWORD: ${{ secrets.TOWER_PASSWORD }}
          TOWER_ORG_ID: ${{ secrets.TOWER_ORG_ID }}
          TOWER_OPERATION_ID: ${{ steps.tower.outputs.taskId }}
          DEPLOY_IMAGE: ${{ steps.tower.outputs.imageUrl }}
        run: node scripts/deploy-container.mjs
