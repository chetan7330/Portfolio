name: Build and publish container
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'data/**'
      - 'tests/**'
      - 'scripts/deploy-container*'
      - 'server.mjs'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.js'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/container.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  container:
    runs-on: ubuntu-latest
    env:
      IMAGE: chetan-portfolio.central-india.cr.tower.cloud/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test deployment logic
        run: node --test scripts/deploy-container.test.mjs
      - name: Build and run embedded tests
        run: docker build -t "$IMAGE:${GITHUB_SHA}" .
      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --name portfolio-check -p 127.0.0.1:3000:3000 "$IMAGE:${GITHUB_SHA}"
          trap 'docker logs portfolio-check; docker rm -f portfolio-check' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:3000/ >/dev/null
          curl --fail http://127.0.0.1:3000/api/portfolio >/dev/null
      - name: Log in to Tower registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: chetan-portfolio.central-india.cr.tower.cloud
          username: ${{ secrets.TOWER_REGISTRY_USERNAME }}
          password: ${{ secrets.TOWER_REGISTRY_PASSWORD }}
      - name: Push tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${GITHUB_SHA}" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
      - name: Deploy published image to Tower
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.TOWER_AUTO_DEPLOY == 'true'
        timeout-minutes: 15
        env:
          TOWER_API_BASE_URL: ${{ vars.TOWER_API_BASE_URL }}
          TOWER_CONTAINER_NAME: ${{ vars.TOWER_CONTAINER_NAME }}
          TOWER_API_TOKEN: ${{ secrets.TOWER_API_TOKEN }}
          DEPLOY_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: node scripts/deploy-container.mjs
