name: Check portfolio
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm test
      - name: Browser tests against the Node server
        run: |
          npm run build
          node server.mjs &
          curl --retry 20 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:3000/api/health
          npm run test:browser
